[build-system]
requires = ["setuptools>=40.6.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "risclog.sqlalchemy"
version = "9.1.dev0"
description = "Encapsulate sqlalchemy modelling infrastructure."
keywords = ["sqlalchemy", "alembic", "model", "infrastructure", "utility"]
requires-python = ">=3.7"
authors = [{ name = "gocept", email = "mail@gocept.com" }]
license = { text = "ZPL 2.1" }
urls = { Homepage = "https://github.com/gocept/risclog.sqlalchemy" }
dynamic = ["readme"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Pyramid",
    "Intended Audience :: Developers",
    "License :: OSI Approved",
    "License :: OSI Approved :: Zope Public License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "SQLAlchemy >= 1.4",
    "alembic >= 0.7",
    "importlib_resources",
    "pytz",
    "setuptools",
    "transaction",
    "zope.component >= 4.0.1",
    "zope.interface",
    "zope.sqlalchemy >= 1.3",
]

[project.optional-dependencies]
test = ["gocept.testdb"]
self-test = [
    "mock",
    "pyramid",
    "pytest",
    "psycopg2-binary",
    "greenlet",
    "pytest-cov",
]
pyramid = ["pyramid"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["risclog.*"]

[tool.setuptools.dynamic]
readme = { file = ["README.rst", "HACKING.rst", "CHANGES.rst"], content-type = "text/x-rst" }

[tool.coverage.run]
relative_files = true
parallel = true
branch = true
source = ["risclog.sqlalchemy"]

[tool.coverage.paths]
source = ["src", ".pytest/*/site-packages"]

[tool.coverage.html]
directory = "coverage-report"

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
exclude_lines = [
    # a more strict default pragma
    "\\# pragma: no cover\\b",

    # allow defensive code
    "^\\s*raise AssertionError\\b",
    "^\\s*raise NotImplementedError\\b",
    "^\\s*return NotImplemented\\b",
    "^\\s*raise$",

    # typing-related code
    "^if (False|TYPE_CHECKING):",
    ": \\.\\.\\.(\\s*#.*)?$",
    "^ +\\.\\.\\.$",
    "-> ['\"]?NoReturn['\"]?:",
]

[tool.ruff]
target-version = "py312"
line-length = 79

[tool.check-manifest]
ignore-bad-ideas = ["*.mo"]
